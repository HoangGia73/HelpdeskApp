name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest --cov=it_support_suite --cov-report=term-missing
      - name: Build unsigned verification artifact
        run: python -m PyInstaller --noconfirm --clean packaging/ITSupportToolSuite.spec
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-verification-build
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
