[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "it-support-tool-suite"
dynamic = ["version"]
description = "Windows desktop toolkit for IT support workflows"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "IT Support Tool Suite Publisher"}]
dependencies = [
  "customtkinter==5.2.2",
  "cryptography==45.0.5",
]

[project.gui-scripts]
it-support-tool-suite = "it_support_suite.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pyinstaller==6.21.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src"]
